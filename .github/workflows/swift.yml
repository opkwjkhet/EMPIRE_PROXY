name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.c'
      - '**/*.plist'
      - '**/*.pbxproj'
      - '.github/workflows/build-unsigned-ipa.yml'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clean
        run: |
          rm -rf build Payload EMPIRE_PROXY-unsigned.ipa

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

          APP_PATH="$(find build -type d -name '*.app' -path '*Release-iphoneos*' -print -quit)"
          if [[ -z "${APP_PATH}" || ! -d "${APP_PATH}" ]]; then
            echo 'No Release-iphoneos .app was produced.' >&2
            find build -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Built app: ${APP_PATH}"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          /usr/bin/zip -qry EMPIRE_PROXY-unsigned.ipa Payload
          test -s EMPIRE_PROXY-unsigned.ipa
          unzip -l EMPIRE_PROXY-unsigned.ipa | sed -n '1,80p'
          ls -lh EMPIRE_PROXY-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: EMPIRE_PROXY-unsigned-ipa
          path: EMPIRE_PROXY-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
