name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.c'
      - '**/*.plist'
      - '**/*.pbxproj'
      - '.github/workflows/build-unsigned-ipa.yml'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clean
        run: |
          rm -rf build Payload EMPIRE_PROXY-unsigned.ipa

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

          APP_PATH="$PWD/build/Release-iphoneos/EmpireProxy.app"

          if [[ ! -d "$APP_PATH" ]]; then
            APP_PATH="$(find "$PWD/build" -type d -name '*.app' -print -quit)"
          fi

          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo 'No .app was produced.' >&2
            find "$PWD/build" -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Built app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          /usr/bin/zip -qry EMPIRE_PROXY-unsigned.ipa Payload
          test -s EMPIRE_PROXY-unsigned.ipa
          unzip -l EMPIRE_PROXY-unsigned.ipa | sed -n '1,80p'
          ls -lh EMPIRE_PROXY-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMPIRE_PROXY-unsigned-ipa
          path: EMPIRE_PROXY-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
